apiVersion: v2
name: k8s-infra
description: |
  Kubernetes 基础公共组件 umbrella chart。
  聚合平台级基础设施资源，与具体业务解耦。当前包含：
    - ingress-nginx controller（作为 dependency 引用官方 chart）
    - iam 平台对外暴露的 Ingress 资源

  未来可扩展：NetworkPolicy、PriorityClass、ServiceMonitor、cert-manager 等。

type: application

# Chart 版本
version: 0.1.0

# 平台默认版本
appVersion: "1.0.0"

# =============================================================================
# 依赖：官方 ingress-nginx chart
# 使用前需执行：
#   helm dependency update deploy/k8s/helm/k8s-infra
# 或部署脚本已经代为处理。
# =============================================================================
dependencies:
  - name: ingress-nginx
    version: 4.11.3
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
