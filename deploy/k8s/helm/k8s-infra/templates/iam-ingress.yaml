{{- if .Values.iamIngress.enabled }}
# -----------------------------------------------------------------------------
# iam 平台对外 Ingress
# -----------------------------------------------------------------------------
# host: iam.local  →  iam-front (:80)
# 前端 nginx pod 内部承担 SPA fallback + /api 反代到 iam-account。
# 因此 Ingress 只需要把根路径流量投给前端 Service 即可。
#
# 注意：此 Ingress 部署在 .Values.iamIngress.namespace（默认 iam），
# 与 iam-front Service 同 namespace；请确保安装 k8s-infra 前 iam
# namespace 已存在（部署脚本会代为创建）。
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.iamIngress.name }}
  namespace: {{ .Values.iamIngress.namespace }}
  labels:
    {{- include "k8s-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: iam-ingress
  {{- with .Values.iamIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.iamIngress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if and .Values.iamIngress.tls.enabled .Values.iamIngress.tls.secretName }}
  tls:
    - hosts:
        - {{ .Values.iamIngress.host | quote }}
      secretName: {{ .Values.iamIngress.tls.secretName | quote }}
  {{- end }}
  rules:
    - {{ if .Values.iamIngress.host }}host: {{ .Values.iamIngress.host | quote }}
      {{ end }}http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.iamIngress.frontServiceName }}
                port:
                  number: {{ .Values.iamIngress.frontServicePort }}
{{- end }}
