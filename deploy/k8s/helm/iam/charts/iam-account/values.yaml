# =============================================================================
# iam-account 子 chart 默认值
# -----------------------------------------------------------------------------
# 说明：
#   1) 大部分连接类配置（mysql）来自 umbrella chart 的 global.config.*，
#      本文件仅在需要时用于覆盖 image / replicaCount / resources 等。
#   2) 端口约定（与 apps/backend/iam-account/conf/config.json 保持一致）：
#        http=8001, grpc=0(未启用), metrics=9091
#      注意：config.go validate() 要求 http_port != metrics_port，故禁止两者同值。
# =============================================================================

enabled: true

replicaCount: 1

image:
  # 若 repository 留空，模板会拼接 global.image.registry + "/" +
  # global.image.repository + "/iam-account"，
  # 最终：host.docker.internal:5000/how-dev-iam/iam-account:<tag>
  repository: ""
  # 若 tag 留空，模板会回退到 global.image.tag，最终回退 .Chart.AppVersion
  tag: ""
  # 留空则继承 global.image.pullPolicy
  pullPolicy: ""

# 该服务所属数据库名；覆盖 global.config.mysql.database
# 留空时使用 global.config.mysql.database
database: "iam_account"

# 独立于 global.config.redis.db 的 db 编号（iam-account 目前未使用 redis，
# 保留字段占位，不影响生成的 configmap）
redisDB: 0

service:
  type: ClusterIP
  httpPort: 8001
  # grpcPort=0 表示暂不启用 gRPC，模板会自动跳过 gRPC port 声明
  grpcPort: 0
  metricsPort: 9091

# 业务侧配置（会渲染进 configmap 的 config.json）
config:
  logLevel: "info"
  serviceName: "iam-account"
  enableSwagger: false
  log:
    # 容器内日志目录使用绝对路径。Dockerfile 中以 uid=10001 的 iam 用户运行，
    # 相对路径会落到 WORKDIR /app 下，非 root 用户无权写入而崩溃。
    # deployment.yaml 会以 emptyDir 挂载到此路径，保证 iam 用户可写。
    dir: "/var/log/iam-account"
    file: "iam-account.log"
    reqFile: "iam-account-req.log"
    toStdout: true
  trace:
    enabled: false
    endpoint: ""
    name: "iam-account"
  mysql:
    maxOpenConns: 100
    maxIdleConns: 20
    connMaxLifeSecs: 3600
  # 密码哈希算法：bcrypt | argon2
  passwordAlgo: "bcrypt"
  # 验证码有效期（秒）
  verifyCodeTTL: 300
  # 邀请令牌有效期（秒）
  invitationTTL: 604800
  # 单条验证码允许的最大校验尝试次数（防爆破）
  verifyCodeMaxRetries: 5

resources: {}
#  limits:
#    cpu: 500m
#    memory: 512Mi
#  requests:
#    cpu: 100m
#    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
