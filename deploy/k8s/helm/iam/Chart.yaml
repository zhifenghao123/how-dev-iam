apiVersion: v2
name: how-dev-iam

description: |
  Helm umbrella chart for the how-dev-iam platform.
  Aggregates all IAM microservice sub-charts to deploy the entire IAM platform on Kubernetes with a single command.

type: application

# Chart 版本：每次调整 Chart 结构或子 chart 版本时需同步递增
version: 0.1.0

# 平台默认应用版本（对应各子服务默认镜像 tag），可在 values.yaml 中被覆盖
appVersion: "20260801"

# =============================================================================
# 子 chart 依赖：子 chart 目录直接放在 charts/ 下，Helm 会自动识别。
# 显式声明 dependencies 用于 helm lint / helm dependency update / condition 开关。
# 注意：iam-authn / iam-authv / iam-authz 目录为空占位，暂未实现，
# 因此不在此声明；如后续接入，请补充 dependencies 条目。
# =============================================================================
dependencies:
  - name: iam-account
    version: 0.1.0
    repository: "file://charts/iam-account"
    condition: iam-account.enabled
    tags:
      - iam-core
  - name: iam-front
    version: 0.1.0
    repository: "file://charts/iam-front"
    condition: iam-front.enabled
    tags:
      - iam-frontend